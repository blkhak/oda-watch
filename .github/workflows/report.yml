name: oda-watch

on:
  # cron은 UTC 기준(KST-9). 예약 실행은 30~45분씩 늦게 시작하기도 하므로 80분 일찍 깨우고,
  # main.py가 보고 시각(08:00·17:50) 12분 전까지 기다렸다가 수집, 보고 시각에 전송한다
  schedule:
    - cron: "40 21 * * 0-4"   # 평일 KST 06:40 → 08:00 보고
    - cron: "30 7 * * 1-5"    # 평일 KST 16:30 → 17:50 보고
  workflow_dispatch:          # Actions 화면에서 수동 실행 (기다리지 않고 바로, 주말·공휴일에도 보냄)
    inputs:
      test_days:
        description: "시험 보고: 최근 며칠 치를 모두 담을지 (0이면 평소처럼 새 글만, 시험 보고는 기록을 바꾸지 않음)"
        default: "0"
      empty_test:
        description: "새 글 0건 문구만 시험 발송 (수집·기록 안 함)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: oda-watch
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 120   # 보고 시각 12분 전까지 최대 70분 대기 + 수집·전송
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt && sudo apt-get install -y -qq fonts-nanum > /dev/null
      - name: 게시판 확인·보고서 전송
        env:
          TZ: Asia/Seoul
          PYTHONIOENCODING: utf-8
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          WAIT_FOR_SLOT: ${{ github.event_name == 'schedule' }}
          TEST_DAYS: ${{ inputs.test_days }}
          EMPTY_TEST: ${{ inputs.empty_test }}
        run: python main.py
      - name: 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: out/*.pdf
          if-no-files-found: ignore
          retention-days: 30
      - name: 상태 저장
        if: success()
        run: |
          git config user.name "oda-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A state
          git diff --cached --quiet && exit 0
          git commit -m "state $(date -u +%FT%TZ)"
          for i in 1 2 3; do git pull -q --rebase && git push && exit 0; sleep $((i * 10)); done   # GitHub 일시 오류 대비
          exit 1
