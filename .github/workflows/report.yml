name: oda-watch

on:
  # cron은 UTC 기준(KST-9). 정각엔 GitHub가 붐벼 10~20분씩 밀리므로 10분 일찍 걸어 둔다
  schedule:
    - cron: "50 22 * * 0-4"   # 평일 KST 07:50 → 오전 보고
    - cron: "50 6 * * 1-5"    # 평일 KST 15:50 → 오후 보고
  workflow_dispatch:          # Actions 화면에서 수동 실행 (주말·공휴일에도 보냄)

permissions:
  contents: write

concurrency:
  group: oda-watch
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: 게시판 확인·보고서 전송
        env:
          TZ: Asia/Seoul
          PYTHONIOENCODING: utf-8
          G2B_API_KEY: ${{ secrets.G2B_API_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
        run: python main.py
      - name: 보고서 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report
          path: out/*.hwpx
          if-no-files-found: ignore
          retention-days: 30
      - name: 상태 저장
        if: success()
        run: |
          git config user.name "oda-watch-bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A state
          git diff --cached --quiet || (git commit -m "state $(date -u +%FT%TZ)" && git push)
