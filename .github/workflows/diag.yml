name: 접속 진단 (임시)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2]
    steps:
      - uses: actions/checkout@v4
      - name: 수출입은행 15회 — 짧게 받은 내용과 끝부분 기록
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import subprocess, time, sources
          url = "https://www.koreaexim.go.kr/HPHKBI039M01"
          shown = False
          for i in range(15):
              t = time.time()
              r = subprocess.run(["curl", "-s", "-S", "-L", "-b", "", "-D", "-", "--max-time", "20", "-A", sources.UA, *sources.ca_bundle(url), url], capture_output=True)
              body = r.stdout.decode("utf-8", "replace")
              print(f"#{i + 1} {time.strftime('%H:%M:%S')} 종료={r.returncode} {len(r.stdout)}B {time.time() - t:.1f}s </html>로끝남={body.rstrip().endswith('</html>')} 오류={r.stderr.decode()[:120].strip()}", flush=True)
              if len(r.stdout) < 5000 and r.stdout and not shown:
                  print("---- 짧은 응답 전체 ----\n" + body + "\n----", flush=True); shown = True
              time.sleep(3)
          EOF
