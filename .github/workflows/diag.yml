name: 접속 진단 (임시)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: 비정상 종료(curl 56) 때 받은 내용 확인
        env:
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import re, subprocess, time, sources
          for url in ["https://www.edcfkorea.go.kr/fe/HPHFFE065M01", "https://www.koreaexim.go.kr/HPHKBI039M01"] * 4:
              r = subprocess.run(["curl", "-s", "-L", "-b", "", "-D", "/tmp/h.txt", "--max-time", "20", "-A", sources.UA, *sources.ca_bundle(url), url], capture_output=True)
              body = r.stdout.decode("utf-8", "replace")
              head = open("/tmp/h.txt", encoding="utf-8", errors="replace").read().split("\n")[0].strip()
              title = re.search(r"<title>(.*?)</title>", body, re.S)
              print(f"{time.strftime('%H:%M:%S')} 종료={r.returncode} {len(r.stdout)}B 상태줄={head!r} 제목={title and title[1].strip()[:60]!r} 게시글표시={body.count('notice-list-item')}", flush=True)
              if r.returncode == 56 and body.count("notice-list-item") == 0:
                  print("---- 앞 600자 ----\n" + body[:600] + "\n---- 끝 300자 ----\n" + body[-300:] + "\n----", flush=True)
              time.sleep(3)
          EOF
