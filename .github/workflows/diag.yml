name: 접속 진단 (임시)

on:
  workflow_dispatch:

jobs:
  diag:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        n: [1, 2, 3]   # 서로 다른 실행 서버(IP)에서 같은 시험
    steps:
      - uses: actions/checkout@v4
      - name: 실행 서버 IP
        run: curl -s https://ipinfo.io/json | grep -E '"(ip|city|org)"'
      - name: 실제 수집 코드로 요청마다 기록 (2회 반복)
        env:
          TZ: Asia/Seoul
          PYTHONIOENCODING: utf-8
        run: |
          python - <<'EOF'
          import time, sources
          orig = sources.subprocess.run
          def run(cmd, **k):
              t = time.time(); r = orig(cmd, **k)
              print(f"{time.strftime('%H:%M:%S')} 종료={r.returncode} {len(r.stdout)}B {time.time() - t:.1f}s {cmd[-1][:95]}", flush=True)
              return r
          sources.subprocess.run = run
          for rnd in (1, 2):
              for name, fn in [("EDCF", sources.edcf), ("수출입은행", sources.exim)]:
                  sources.DEADLINE = time.time() + 240
                  try:
                      print(f"[{rnd}회] {name} 성공 {len(fn())}건", flush=True)
                  except Exception as e:
                      print(f"[{rnd}회] {name} 실패 {e}", flush=True)
          EOF
